<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<style>
  :root{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
  body{background:#f3f4f6;margin:0;color:#111827;}
  .wrap{max-width:1160px;margin:0 auto;padding:24px 16px;}
  table.dt{width:100%;}
  table.dt td:last-child,table.dt th:last-child{white-space:nowrap;}
  header h1{margin:0;font-size:24px;} header p{margin:4px 0 0;color:#6b7280;font-size:14px;}
  /* Menú flotante (FAB + pills) — sin panel ni fondo que tape el contenido */
  .menu-toggle{display:none;}
  .menu-btn{position:fixed;top:18px;left:18px;z-index:40;cursor:pointer;width:44px;height:44px;
        border-radius:50%;background:#fff;border:1px solid #eef0f3;color:#374151;font-size:18px;
        display:flex;align-items:center;justify-content:center;
        box-shadow:0 3px 12px rgba(17,24,39,.10);transition:transform .2s, box-shadow .2s;}
  .menu-btn:hover{box-shadow:0 6px 18px rgba(17,24,39,.16);}
  .menu-toggle:checked ~ .menu-btn{transform:rotate(90deg);color:#ea580c;}
  /* Backdrop invisible: cierra al clickear afuera, sin oscurecer nada */
  .menu-overlay{position:fixed;inset:0;background:transparent;z-index:38;display:none;}
  .menu-toggle:checked ~ .menu-overlay{display:block;}
  .menu-items{position:fixed;top:74px;left:18px;z-index:39;display:flex;flex-direction:column;gap:9px;
        opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;
        transition:opacity .18s ease, transform .18s ease;}
  .menu-toggle:checked ~ .menu-items{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
  .menu-items a{background:#fff;border:1px solid #eef0f3;border-radius:12px;padding:10px 18px;
        text-decoration:none;color:#374151;font-size:14px;font-weight:600;white-space:nowrap;
        box-shadow:0 3px 12px rgba(17,24,39,.08);transition:transform .15s, box-shadow .15s;}
  .menu-items a:hover{transform:translateX(4px);box-shadow:0 5px 16px rgba(17,24,39,.14);}
  .menu-items a.on{background:#f97316;color:#fff;border-color:#f97316;
        box-shadow:0 5px 16px rgba(249,115,22,.40);}
  .wrap header{padding-left:54px;}   /* deja lugar al botón flotante */
  @media (max-width:560px){
    .wrap{padding:18px 12px;} .wrap header{padding-left:48px;}
    table.dt th,table.dt td{padding:6px 6px;font-size:12px;}
    form .grid{grid-template-columns:1fr;}
  }
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin:18px 0;}
  .card h2{margin:0 0 14px;font-size:17px;}
  form .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  label{display:flex;flex-direction:column;font-size:12px;color:#6b7280;gap:4px;}
  label.full{grid-column:1 / -1;}
  input,select{padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;color:#111827;}
  button{margin-top:14px;padding:9px 16px;border:0;border-radius:8px;background:#1f2937;color:#fff;
         font-size:13px;font-weight:600;cursor:pointer;}
  button.ok{background:#16a34a;} button.danger{background:#dc2626;} button:hover{opacity:.92;}
  button.mini{margin:0;padding:5px 10px;font-size:12px;}
  table.dt{width:100%;border-collapse:collapse;}
  table.dt th,table.dt td{padding:8px 10px;border-bottom:1px solid #f0f0f0;font-size:13px;text-align:left;}
  table.dt th{color:#6b7280;font-weight:600;font-size:12px;}
  tr.off{opacity:.55;}
  code{background:#f3f4f6;padding:1px 6px;border-radius:5px;font-size:12px;}
  .badge{padding:2px 9px;border-radius:11px;font-size:11px;font-weight:700;color:#fff;}
  .badge.on{background:#16a34a;} .badge.off{background:#9ca3af;}
  .banner{border-radius:10px;padding:12px 14px;margin:14px 0 0;font-size:14px;}
  .banner.ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;}
  .banner.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;}
  .banner .key{margin-top:8px;background:#064e3b;color:#fff;padding:8px 10px;border-radius:8px;}
  .banner .key code{background:transparent;color:#a7f3d0;font-size:13px;}
  .acciones{display:flex;gap:6px;align-items:center;}
  /* Switch activo/inactivo */
  .switch{position:relative;display:inline-block;width:40px;height:22px;vertical-align:middle;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .slider{position:absolute;cursor:pointer;inset:0;background:#cbd5e1;border-radius:22px;transition:.2s;}
  .switch .slider:before{content:"";position:absolute;height:16px;width:16px;left:3px;bottom:3px;
        background:#fff;border-radius:50%;transition:.2s;}
  .switch input:checked + .slider{background:#16a34a;}
  .switch input:checked + .slider:before{transform:translateX(18px);}
  /* Botones-ícono (editar/borrar/módulos) */
  .icon-btn{margin:0;padding:5px 8px;border:0;border-radius:7px;background:#eef2f7;cursor:pointer;
        font-size:14px;line-height:1;text-decoration:none;color:#374151;display:inline-flex;}
  .icon-btn:hover{background:#e2e8f0;} .icon-btn.del:hover{background:#fee2e2;}
  .modrow{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;
        border-bottom:1px solid #f0f0f0;}
  .modrow:last-child{border-bottom:0;}
  /* Contador de módulos: círculo de tamaño fijo, color por valor */
  .modnum{display:inline-flex;width:24px;height:24px;border-radius:50%;flex:0 0 24px;
        align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;}
  /* Packs: checkboxes del alta + chips en la tabla */
  .lbl{display:block;font-size:13px;color:#374151;margin:0 0 6px;font-weight:600;}
  .packs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .pack{display:block;border:1px solid #e5e7eb;border-radius:9px;padding:9px 11px;cursor:pointer;
        background:#fff;transition:.15s;}
  .pack.on{border-color:#f97316;background:#fff7ed;}
  .pack input{margin-right:7px;vertical-align:middle;}
  .pack-name{font-size:13px;font-weight:600;color:#1f2937;}
  .pack-name em{color:#9ca3af;font-weight:400;font-style:normal;font-size:11px;}
  .pack-desc{display:block;font-size:11px;color:#6b7280;margin-top:3px;margin-left:21px;}
  .pack-chip{display:inline-block;background:#eef2f7;color:#374151;border-radius:9px;
        padding:1px 8px;margin:1px 3px 1px 0;font-size:10px;font-weight:600;}
  @media(max-width:640px){.packs-grid{grid-template-columns:1fr;}}
  /* Integraciones: secciones + calugas + modal (checkbox-hack, sin JS) */
  .sec-title{font-size:13px;font-weight:700;color:#374151;text-transform:uppercase;
        letter-spacing:.4px;margin:0 0 4px;}
  .cal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:8px 0 4px;}
  .ig-toggle{position:absolute;opacity:0;width:0;height:0;}
  .caluga{display:flex;flex-direction:column;align-items:center;gap:9px;padding:18px 12px;
        border:1px solid #e5e7eb;border-radius:14px;background:#fff;cursor:pointer;
        transition:.15s;text-align:center;}
  .caluga:hover{border-color:#f97316;box-shadow:0 4px 14px rgba(0,0,0,.07);transform:translateY(-2px);}
  .cal-logo{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;
        justify-content:center;font-weight:800;font-size:19px;color:#fff;flex:none;}
  .cal-name{font-size:13px;font-weight:600;color:#1f2937;line-height:1.2;}
  .cal-state{font-size:10px;font-weight:700;padding:2px 9px;border-radius:10px;text-transform:uppercase;}
  .cal-state.on{background:#dcfce7;color:#166534;} .cal-state.off{background:#f3f4f6;color:#9ca3af;}
  .ig-modal{display:none;position:fixed;inset:0;z-index:60;align-items:center;justify-content:center;padding:16px;}
  .ig-toggle:checked + .ig-modal{display:flex;}
  .ig-modal-bg{position:absolute;inset:0;background:rgba(17,24,39,.45);}
  .ig-modal-box{position:relative;background:#fff;border-radius:16px;padding:20px 22px;
        width:min(440px,94vw);max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.28);}
  .ig-modal-head{display:flex;align-items:center;justify-content:space-between;
        margin:0 0 14px;border-bottom:1px solid #f0f0f0;padding-bottom:12px;}
  .ig-modal-x{cursor:pointer;font-size:24px;color:#9ca3af;line-height:1;padding:0 6px;border-radius:8px;text-decoration:none;}
  .ig-modal-x:hover{background:#f3f4f6;color:#374151;}
</style>
