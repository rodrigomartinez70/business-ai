<table id="usr-tabla" class="dt"{% if oob %} hx-swap-oob="true"{% endif %}>
  <thead><tr><th>Usuario</th><th>Estado</th><th>Creado</th><th></th></tr></thead>
  <tbody>
    {% for u in usuarios %}
    <tr class="{{ 'off' if not u.activo else '' }}">
      <td><strong>{{ u.username }}</strong></td>
      <td>
        <label class="switch" title="{{ 'Activo' if u.activo else 'Inactivo' }}">
          <input type="checkbox" {% if u.activo %}checked{% endif %}
                 hx-post="/admin/usuarios/{{ u.id }}/toggle"
                 hx-vals='{"activo": "{{ "false" if u.activo else "true" }}"}'
                 hx-target="#usr-tabla" hx-swap="outerHTML">
          <span class="slider"></span>
        </label>
      </td>
      <td>{{ u.created_at.strftime('%Y-%m-%d') if u.created_at else '—' }}</td>
      <td><div class="acciones">
        <button class="icon-btn" title="Cambiar contraseña"
                hx-get="/admin/usuarios/{{ u.id }}/password"
                hx-target="closest tr" hx-swap="outerHTML">&#128273;</button>
        <button class="icon-btn del" title="Eliminar"
                hx-post="/admin/usuarios/{{ u.id }}/delete"
                hx-target="#usr-tabla" hx-swap="outerHTML"
                hx-confirm="¿Eliminar el usuario {{ u.username }}?">&#128465;</button>
      </div></td>
    </tr>
    {% else %}
    <tr><td colspan="4" style="color:#9ca3af;">Sin usuarios (el admin del entorno siempre entra).</td></tr>
    {% endfor %}
  </tbody>
</table>
