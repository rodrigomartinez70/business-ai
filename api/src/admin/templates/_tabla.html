<table id="tabla" class="dt"{% if oob %} hx-swap-oob="true"{% endif %}>
  <thead>
    <tr><th>ID</th><th>Nombre</th><th>Packs</th><th>Keys</th><th>Estado</th><th>Módulos</th><th>Integr.</th><th>Config</th><th>Modelo</th><th>Email</th></tr>
  </thead>
  <tbody>
    {% for t in tenants %}
    <tr class="{{ 'off' if not t.activo else '' }}">
      <td><code>{{ t.id }}</code></td>
      <td>{{ t.nombre }}</td>
      <td>
        {% for p in t.packs %}<span class="pack-chip">{{ p }}</span>{% endfor %}
        {% if not t.packs %}<span style="color:#9ca3af;">{{ t.vertical }}</span>{% endif %}
      </td>
      <td>{{ t.keys_activas }}</td>
      <td>
        <label class="switch" title="{{ 'Activa' if t.activo else 'Inactiva' }}">
          <input type="checkbox" {% if t.activo %}checked{% endif %}
                 hx-post="/admin/tenants/{{ t.id }}/toggle"
                 hx-vals='{"activo": "{{ "false" if t.activo else "true" }}"}'
                 hx-target="#tabla" hx-swap="outerHTML">
          <span class="slider"></span>
        </label>
      </td>
      <td>
        <a class="icon-btn" href="/admin/tenants/{{ t.id }}/modulos"
           title="Módulos activos del informe" style="gap:6px;background:transparent;">
          <span class="modnum" style="background:{{ t.modulos_color }};">{{ t.modulos_activos }}</span>
          &#9881;</a>
      </td>
      <td>
        <a class="icon-btn" href="/admin/tenants/{{ t.id }}/integraciones"
           title="Integraciones del tenant">&#128268;</a>
      </td>
      <td>
        <a class="icon-btn" href="/admin/tenants/{{ t.id }}/config"
           title="Config / KPIs particulares">&#128221;</a>
      </td>
      <td>
        <a class="icon-btn" href="/admin/tenants/{{ t.id }}/modelo" target="_blank"
           title="Modelo de datos (tablas/columnas)">&#128208;</a>
      </td>
      <td style="display:flex;gap:6px;">
        <a class="icon-btn" href="/admin/tenants/{{ t.id }}/preview" target="_blank"
           title="Previsualizar el email">&#128065;</a>
        <button class="icon-btn del" type="button" title="Eliminar empresa (irreversible)"
                hx-post="/admin/tenants/{{ t.id }}/eliminar"
                hx-target="#resultado" hx-swap="innerHTML"
                hx-confirm="¿ELIMINAR la empresa «{{ t.id }}»? Se borra su schema y TODOS sus datos. Es IRREVERSIBLE.">&#128465;</button>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="10" style="color:#9ca3af;">Sin empresas todavía.</td></tr>
    {% endfor %}
  </tbody>
</table>
