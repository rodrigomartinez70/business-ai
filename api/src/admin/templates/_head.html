<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<style>
  :root{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
  body{background:#f3f4f6;margin:0;color:#111827;}
  .wrap{max-width:920px;margin:0 auto;padding:24px 16px;}
  header h1{margin:0;font-size:24px;} header p{margin:4px 0 0;color:#6b7280;font-size:14px;}
  /* Menú lateral izquierdo colapsable (CSS puro, checkbox-hack) — sin fondo de color */
  .menu-toggle{display:none;}
  .menu-btn{position:fixed;top:14px;left:14px;z-index:40;cursor:pointer;font-size:20px;
        background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:3px 11px;color:#374151;line-height:1.4;}
  .menu-btn:hover{background:#f3f4f6;}
  .menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.12);z-index:35;display:none;}
  .menu-toggle:checked ~ .menu-overlay{display:block;}
  .side-menu{position:fixed;top:0;left:-280px;width:240px;height:100%;background:#fff;
        z-index:38;transition:left .25s ease;padding:56px 14px;box-sizing:border-box;
        border-right:1px solid #e5e7eb;box-shadow:3px 0 14px rgba(0,0,0,.06);}
  .menu-toggle:checked ~ .side-menu{left:0;}
  .side-menu-title{color:#6b7280;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin:0 8px 12px;}
  .side-menu a{display:block;color:#374151;padding:10px 10px;text-decoration:none;border-radius:8px;
        font-size:14px;font-weight:600;margin:2px 0;}
  .side-menu a:hover{background:#f3f4f6;}
  .side-menu a.on{background:#eff6ff;color:#2563eb;}
  .wrap header{padding-left:44px;}   /* deja lugar al botón ☰ arriba-izquierda */
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin:18px 0;}
  .card h2{margin:0 0 14px;font-size:17px;}
  form .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  label{display:flex;flex-direction:column;font-size:12px;color:#6b7280;gap:4px;}
  label.full{grid-column:1 / -1;}
  input,select{padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;color:#111827;}
  button{margin-top:14px;padding:9px 16px;border:0;border-radius:8px;background:#1f2937;color:#fff;
         font-size:13px;font-weight:600;cursor:pointer;}
  button.ok{background:#16a34a;} button.danger{background:#dc2626;} button:hover{opacity:.92;}
  button.mini{margin:0;padding:5px 10px;font-size:12px;}
  table.dt{width:100%;border-collapse:collapse;}
  table.dt th,table.dt td{padding:8px 10px;border-bottom:1px solid #f0f0f0;font-size:13px;text-align:left;}
  table.dt th{color:#6b7280;font-weight:600;font-size:12px;}
  tr.off{opacity:.55;}
  code{background:#f3f4f6;padding:1px 6px;border-radius:5px;font-size:12px;}
  .badge{padding:2px 9px;border-radius:11px;font-size:11px;font-weight:700;color:#fff;}
  .badge.on{background:#16a34a;} .badge.off{background:#9ca3af;}
  .banner{border-radius:10px;padding:12px 14px;margin:14px 0 0;font-size:14px;}
  .banner.ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;}
  .banner.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;}
  .banner .key{margin-top:8px;background:#064e3b;color:#fff;padding:8px 10px;border-radius:8px;}
  .banner .key code{background:transparent;color:#a7f3d0;font-size:13px;}
  .acciones{display:flex;gap:6px;align-items:center;}
  /* Switch activo/inactivo */
  .switch{position:relative;display:inline-block;width:40px;height:22px;vertical-align:middle;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .slider{position:absolute;cursor:pointer;inset:0;background:#cbd5e1;border-radius:22px;transition:.2s;}
  .switch .slider:before{content:"";position:absolute;height:16px;width:16px;left:3px;bottom:3px;
        background:#fff;border-radius:50%;transition:.2s;}
  .switch input:checked + .slider{background:#16a34a;}
  .switch input:checked + .slider:before{transform:translateX(18px);}
  /* Botones-ícono (editar/borrar/módulos) */
  .icon-btn{margin:0;padding:5px 8px;border:0;border-radius:7px;background:#eef2f7;cursor:pointer;
        font-size:14px;line-height:1;text-decoration:none;color:#374151;display:inline-flex;}
  .icon-btn:hover{background:#e2e8f0;} .icon-btn.del:hover{background:#fee2e2;}
  .modrow{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;
        border-bottom:1px solid #f0f0f0;}
  .modrow:last-child{border-bottom:0;}
  /* Contador de módulos: círculo de tamaño fijo, color por valor */
  .modnum{display:inline-flex;width:24px;height:24px;border-radius:50%;flex:0 0 24px;
        align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;}
</style>
