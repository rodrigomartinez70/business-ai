<!DOCTYPE html>
<html lang="es">
<head>
<title>MBI Admin — Empresas</title>
{% include "_head.html" %}
</head>
<body>
{% include "_menu.html" %}
<div class="wrap">
  <header><h1>MBI Admin</h1><p>Gestión de empresas (tenants)</p></header>

  <section class="card">
    <h2>Nueva empresa</h2>
    <form hx-post="/admin/tenants" hx-target="#resultado" hx-swap="innerHTML">
      <div class="grid">
        <label>ID (slug) <input name="tenant_id" placeholder="restaurante_xyz" required></label>
        <label>Nombre <input name="nombre" placeholder="Restaurante XYZ" required></label>
        <label>Vertical
          <select name="vertical">
            {% for v in verticales %}<option value="{{ v }}">{{ v }}</option>{% endfor %}
          </select>
        </label>
        <label class="full">Destinatarios del reporte (coma-separados)
          <input name="email_to" placeholder="dueno@empresa.cl, contador@empresa.cl"></label>
      </div>
      <button type="submit">Crear empresa</button>
    </form>
    <div id="resultado"></div>
  </section>

  <section class="card">
    <h2>Empresas</h2>
    {% include "_tabla.html" %}
  </section>
</div>
</body>
</html>
