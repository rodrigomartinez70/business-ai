{% set path = request.url.path %}
<input type="checkbox" id="menu-toggle" class="menu-toggle">
<label for="menu-toggle" class="menu-btn" title="Menú">&#9776;</label>
<label for="menu-toggle" class="menu-overlay"></label>
<div class="menu-items">
  <a href="/admin"
     class="{{ 'on' if path == '/admin' or path.startswith('/admin/tenants') else '' }}">Empresas</a>
  <a href="/admin/schedules"
     class="{{ 'on' if path.startswith('/admin/schedules') else '' }}">Programación de correos</a>
  <a href="/admin/usuarios"
     class="{{ 'on' if path.startswith('/admin/usuarios') else '' }}">Usuarios</a>
</div>
