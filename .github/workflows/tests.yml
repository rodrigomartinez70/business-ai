name: Tests & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r api/requirements.txt -r requirements-test.txt

      - name: Start test database
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Run tests
        working-directory: api
        env:
          DATABASE_URL: postgresql://test_admin:test_password@localhost:5435/test_negocio_db
          INGEST_DATABASE_URL: postgresql://test_admin:test_password@localhost:5435/test_negocio_db
          BUSINESS_CONFIG_PATH: api/config.yaml
          API_KEY_GERENTE: test-key-gerente
          API_KEY_ADMINISTRACION: test-key-admin
          API_KEY_RECEPCION: test-key-recepcion
          ANTHROPIC_API_KEY: ""
          OLLAMA_URL: http://localhost:11434
        run: python -m pytest ../tests/ -v

      - name: Stop test database
        if: always()
        run: docker compose -f docker-compose.test.yml down

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Sync source code
        run: |
          rsync -avz --delete \
            -e "ssh" \
            api/src/ \
            root@${{ secrets.DEPLOY_HOST }}:/opt/ia_hotel/api/src/
          rsync -avz \
            -e "ssh" \
            api/requirements.txt \
            api/Dockerfile \
            api/sql_guidelines.md \
            api/config.yaml \
            root@${{ secrets.DEPLOY_HOST }}:/opt/ia_hotel/api/
          rsync -avz \
            -e "ssh" \
            scripts/ \
            root@${{ secrets.DEPLOY_HOST }}:/opt/ia_hotel/scripts/
          rsync -avz \
            -e "ssh" \
            cron/ \
            root@${{ secrets.DEPLOY_HOST }}:/opt/ia_hotel/cron/
          rsync -avz --delete \
            -e "ssh" \
            discord_bot/ \
            root@${{ secrets.DEPLOY_HOST }}:/opt/ia_hotel/discord_bot/

      - name: Rebuild API and scripts image
        run: |
          ssh root@${{ secrets.DEPLOY_HOST }} \
            "cd /opt/ia_hotel && docker compose up -d --build api discord_bot && docker build -t hotel_scripts ./scripts/"

      - name: Setup daily data cron
        run: |
          ssh root@${{ secrets.DEPLOY_HOST }} "
            grep -q 'generar_datos' /etc/cron.d/hotel_data 2>/dev/null || \
            echo '0 2 * * * root docker run --rm --network ia_hotel_default --env-file /opt/ia_hotel/.env hotel_scripts --ayer >> /var/log/hotel_data.log 2>&1' \
            > /etc/cron.d/hotel_data
          "

      - name: Health check
        run: |
          ssh root@${{ secrets.DEPLOY_HOST }} \
            "sleep 5 && docker run --rm --network ia_hotel_default curlimages/curl:latest \
             -sf http://hotel_api:8000/api/health"
